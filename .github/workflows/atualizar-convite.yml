name: Atualizar imagens do convite Halloween
on:
  push:
    branches: [main]
    paths:
      - scripts/gerar_convite_halloween.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar-imagens:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: pip install Pillow==11.3.0
      - name: Gerar convite com fotos originais
        run: python scripts/gerar_convite_halloween.py
      - name: Publicar somente imagens atualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fotos/convite-og.jpg assets/fotos/convite-whatsapp.jpg
          if ! git diff --cached --quiet; then
            git commit -m "fix: imagens do Halloween em 01/11/2026"
            git push
          fi
